name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  ARM_TOOLCHAIN_VERSION: 14.2.rel1

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build build-essential libusb-1.0-0-dev pkg-config

      - name: Install Arm GNU toolchain (pinned, same as local builds)
        run: |
          url="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL -o arm.tar.xz "$url"
          mkdir -p "$HOME/arm" && tar -xf arm.tar.xz -C "$HOME/arm" --strip-components=1
          echo "$HOME/arm/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: arm-none-eabi-gcc --version | head -1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPICO_SDK_PATH=third_party/pico-sdk

      - name: Build
        run: cmake --build build -j

      - name: Check firmware fits the 1 MiB firmware region
        run: |
          size=$(stat -c %s build/picoboy.bin)
          echo "picoboy.bin: $size bytes (limit 1048576)"
          test "$size" -le 1048576

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: picoboy-uf2
          path: build/picoboy.uf2
          if-no-files-found: error
